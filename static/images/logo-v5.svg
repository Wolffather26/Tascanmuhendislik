<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern geometric + organic blend -->
  <circle cx="100" cy="100" r="95" fill="#f8f9ff" stroke="#e0e7ff" stroke-width="1.5"/>
  
  <!-- Organic splatter shapes -->
  <path d="M 100 30 Q 120 50, 130 70 Q 135 85, 125 95 Q 110 105, 95 100 Q 85 75, 100 30" 
        fill="#6366f1" opacity="0.7"/>
  
  <path d="M 160 100 Q 170 120, 155 140 Q 135 145, 125 130 Q 130 110, 160 100" 
        fill="#ec4899" opacity="0.6"/>
  
  <path d="M 50 140 Q 40 155, 55 165 Q 75 168, 80 150 Q 70 135, 50 140" 
        fill="#f97316" opacity="0.5"/>
  
  <!-- Minimalist center element -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="12" fill="#6366f1" opacity="0.3"/>
  
  <!-- Floating dots for depth -->
  <circle cx="80" cy="70" r="3" fill="#ec4899" opacity="0.7"/>
  <circle cx="140" cy="65" r="2.5" fill="#f97316" opacity="0.6"/>
  <circle cx="70" cy="110" r="2" fill="#6366f1" opacity="0.5"/>
</svg>
