<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4f8" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Lightning bolt (modern minimalist) -->
  <path d="M 100 30 L 70 85 L 95 85 L 60 170 L 115 90 L 85 90 Z" 
        fill="#0066cc" 
        stroke="#0066cc" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- Accent lines (circuit pattern) -->
  <line x1="50" y1="100" x2="70" y2="100" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="100" x2="150" y2="100" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small dots for tech feel -->
  <circle cx="60" cy="100" r="3" fill="#ff6b35"/>
  <circle cx="140" cy="100" r="3" fill="#ff6b35"/>
</svg>
