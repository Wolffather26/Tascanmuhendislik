<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Left top: Şimşek (Elektrik Proje) -->
  <path d="M 45 35 L 55 60 L 50 60 L 65 90 L 45 90 L 58 45 Z" 
        fill="#ea580c" stroke="#d84315" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Right top: Tuğla (İnşaat) -->
  <rect x="130" y="30" width="35" height="25" fill="#059669" opacity="0.8" rx="2"/>
  <line x1="135" y1="30" x2="135" y2="55" stroke="#047857" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="30" x2="140" y2="55" stroke="#047857" stroke-width="1" opacity="0.6"/>
  <line x1="145" y1="30" x2="145" y2="55" stroke="#047857" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="30" x2="150" y2="55" stroke="#047857" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="37" x2="165" y2="37" stroke="#047857" stroke-width="0.8" opacity="0.6"/>
  <line x1="130" y1="47" x2="165" y2="47" stroke="#047857" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Left bottom: Fişi (Tesisat) -->
  <rect x="25" y="120" width="20" height="35" fill="#10b981" opacity="0.8" rx="2"/>
  <circle cx="32" cy="140" r="2.5" fill="#ffffff"/>
  <circle cx="38" cy="140" r="2.5" fill="#ffffff"/>
  <rect x="28" y="155" width="2" height="8" fill="#10b981"/>
  <rect x="36" y="155" width="2" height="8" fill="#10b981"/>
  
  <!-- Right bottom: Kutuda ürün (Bayilik) -->
  <rect x="135" y="125" width="30" height="28" fill="#f97316" opacity="0.7" stroke="#ea580c" stroke-width="1" rx="2"/>
  <line x1="135" y1="134" x2="165" y2="134" stroke="#ea580c" stroke-width="1"/>
  <circle cx="142" cy="141" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="141" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="158" cy="141" r="2.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Center: Connecting lines (iş birliği) -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <line x1="65" y1="60" x2="90" y2="90" stroke="#059669" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="145" y1="60" x2="110" y2="90" stroke="#ea580c" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="45" y1="140" x2="85" y2="105" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="155" y1="140" x2="115" y2="105" stroke="#f97316" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
  
  <!-- Center icon: T harfi (Taşcan) -->
  <text x="100" y="108" font-size="28" font-weight="bold" fill="#059669" text-anchor="middle" opacity="0.6">T</text>
</svg>
