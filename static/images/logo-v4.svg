<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Large playful circles -->
  <circle cx="70" cy="70" r="40" fill="#ff6b9d" opacity="0.7"/>
  <circle cx="130" cy="80" r="35" fill="#a8e6cf" opacity="0.6"/>
  <circle cx="100" cy="130" r="38" fill="#ffd93d" opacity="0.65"/>
  
  <!-- Overlapping creates interesting shapes -->
  <circle cx="85" cy="95" r="25" fill="#8e44ad" opacity="0.5"/>
  
  <!-- White accent circles -->
  <circle cx="95" cy="70" r="8" fill="white" opacity="0.8"/>
  <circle cx="120" cy="110" r="6" fill="white" opacity="0.7"/>
  <circle cx="50" cy="120" r="5" fill="white" opacity="0.6"/>
</svg>
